name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
      - name: Checkout OpenWrt
        run: git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
      - name: Install LuCI feed
        working-directory: openwrt
        run: |
          ./scripts/feeds update luci
          ./scripts/feeds install luci-base
      - name: Add theme
        run: |
          mkdir -p openwrt/feeds/luci/themes/luci-theme-sophos
          cp -a Makefile ucode htdocs root openwrt/feeds/luci/themes/luci-theme-sophos/
      - name: Configure and build
        working-directory: openwrt
        run: |
          ./scripts/feeds install luci-theme-sophos
          echo 'CONFIG_TARGET_x86=y' > .config
          echo 'CONFIG_TARGET_x86_64=y' >> .config
          echo 'CONFIG_PACKAGE_luci-base=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-sophos=y' >> .config
          make defconfig
          make package/luci-theme-sophos/compile V=s
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: openwrt/bin/packages/**/luci/luci-theme-sophos_*.ipk
          generate_release_notes: true
